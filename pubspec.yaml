name: spotify_bloc
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  
  #State Management
  flutter_bloc: ^9.0.0
  hydrated_bloc: ^10.0.0
  equatable: ^2.0.7

  #Storage
  path_provider: ^2.1.5

  #Navigation
  go_router: ^14.8.0

  #firebase
  firebase_core: ^3.11.0
  firebase_auth: ^5.4.2
  cloud_firestore: ^5.6.3

  #image
  cached_network_image: ^3.4.1
  

  #Dependency Injection
  get_it: ^8.0.3

  
  #utils
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  fluttertoast: ^8.2.12
  flutter_easyloading: ^3.0.5
  loading_animation_widget: ^1.3.0
  just_audio: ^0.9.46
  flutter_localization: ^0.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner:
  flutter_gen_runner:


flutter:

  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/images/
    - assets/fonts/

  fonts:
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Black.ttf
          weight: 900
        - asset: assets/fonts/Satoshi-Bold.ttf
          weight: 600
        - asset: assets/fonts/Satoshi-Light.ttf
          weight: 500
        - asset: assets/fonts/Satoshi-Medium.ttf
          weight: 400
        - asset: assets/fonts/Satoshi-Regular.ttf
          weight: 300

          